# Shared with site/assets/site.css; see docs/DESIGN.md.
[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#116559"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#eaf1eb"
textColor = "#203433"
font = "DM Sans, sans-serif"
headingFont = "DM Sans, sans-serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "1rem"]
headingFontWeights = 600

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/fonts/dm-sans-latin-wght-normal.woff2"
weight = "100 1000"
style = "normal"
