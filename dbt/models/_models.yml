version: 2
models:
  - name: stg_games
    description: One accepted game, preserving source dates and nullable opening tags.
    columns:
      - name: provider
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: game_key
        description: Surrogate of provider and game_id. MetricFlow needs one primary column.
        data_tests: [not_null, unique]
      - name: rated
        description: Source rated flag. Published snapshots keep only rated games.
        data_tests: [not_null]
      - name: variant
        description: Source variant. Published snapshots keep only Standard.
        data_tests: [not_null]
      - name: opening_family
        description: Trimmed source opening text before the first colon. Null when the tag is missing.
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ['1-0', '0-1', '1/2-1/2', '*']
  - name: stg_player_games
    description: One participant per game and color, with rating at that game.
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: game_key
        description: Same surrogate as the game, for the player-game join.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_key
      - name: player_game_key
        description: Surrogate of game_key and color.
        data_tests: [not_null, unique]
      - name: rating_band
        description: Closed 200-point band containing the rating, or null when the rating is missing.
      - name: color
        data_tests:
          - accepted_values:
              arguments:
                values: ['white', 'black']
  - name: int_game_eligibility
    description: Game-grain eligibility for the versioned game draw-rate contract.
    columns:
      - name: game_id
        data_tests: [not_null]
  - name: mart_game_outcomes
    description: Date and exact time-control outcome counts. Null dates and controls remain visible.
    columns:
      - name: accepted_games
        data_tests: [not_null]
      - name: eligible_games
        data_tests: [not_null]
      - name: drawn_games
        data_tests: [not_null]
  - name: mart_player_outcomes
    description: Player-game grain; descriptive scores, not a causal opening analysis.
    columns:
      - name: game_id
        data_tests: [not_null]
