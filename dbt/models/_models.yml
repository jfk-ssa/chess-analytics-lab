version: 2
models:
  - name: stg_games
    description: One accepted game, preserving source dates and nullable opening tags.
    columns:
      - name: provider
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: game_key
        description: Surrogate of provider and game_id. MetricFlow needs one primary column.
        data_tests: [not_null, unique]
      - name: rated
        description: Source rated flag. Published snapshots keep only rated games.
        data_tests: [not_null]
      - name: variant
        description: Source variant. Published snapshots keep only Standard.
        data_tests: [not_null]
      - name: opening_family
        description: Trimmed source opening text before the first colon. Null when the tag is missing.
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ['1-0', '0-1', '1/2-1/2', '*']
  - name: stg_player_games
    description: One participant per game and color, with rating at that game.
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: game_key
        description: Same surrogate as the game, for the player-game join.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_key
      - name: player_game_key
        description: Surrogate of game_key and color.
        data_tests: [not_null, unique]
      - name: color
        data_tests:
          - accepted_values:
              arguments:
                values: ['white', 'black']
  - name: int_game_eligibility
    description: Game-grain eligibility for the versioned game draw-rate contract.
    columns:
      - name: game_id
        data_tests: [not_null]
  - name: mart_game_outcomes
    description: Date and exact time-control outcome counts. Null dates and controls remain visible.
    config:
      contract:
        enforced: true
    columns:
      - name: utc_date
        data_type: date
      - name: base_seconds
        data_type: bigint
      - name: increment_seconds
        data_type: bigint
      - name: accepted_games
        data_type: bigint
        data_tests: [not_null]
      - name: eligible_games
        data_type: bigint
        data_tests: [not_null]
      - name: drawn_games
        data_type: bigint
        data_tests: [not_null]
      - name: unknown_results
        data_type: bigint
      - name: marked_bots
        data_type: bigint
      - name: missing_source_opening
        data_type: bigint
  - name: mart_player_outcomes
    description: Player-game grain; descriptive scores, not a causal opening analysis.
    config:
      contract:
        enforced: true
    columns:
      - name: provider
        data_type: varchar
      - name: game_id
        data_type: varchar
        data_tests: [not_null]
      - name: color
        data_type: varchar
      - name: player_key
        data_type: varchar
      - name: rating
        data_type: bigint
      - name: opponent_rating
        data_type: bigint
      - name: score
        data_type: double
      - name: utc_date
        data_type: date
      - name: base_seconds
        data_type: bigint
      - name: increment_seconds
        data_type: bigint
      - name: metric_eligible
        data_type: boolean
      - name: win
        data_type: integer
      - name: draw
        data_type: integer
      - name: loss
        data_type: integer
