version: 2

exposures:
  - name: governed_metric_analyst
    label: Governed metric analyst
    type: application
    maturity: medium
    url: https://github.com/jfk-ssa/chess-analytics-lab/blob/main/docs/MCP.md
    description: >
      query_metric and compare_openings read the governed draw-rate, opening-usage,
      and opening-score metrics from the published mart when that mart matches the
      analytical snapshot. chesslab mcp serves those same tools over stdio.
      Clock, engine, and Maia tools do not read these models. A mismatch or a
      failed semantic query keeps the reviewed SQL on the analytical snapshot.
    depends_on:
      - ref('games')
      - ref('player_games')
      - metric('eligible_games')
      - metric('drawn_games')
      - metric('game_draw_rate')
      - metric('known_opening_games')
      - metric('unknown_opening_games')
      - metric('opening_score_games')
      - metric('opening_score_total')
      - metric('opening_wins')
      - metric('opening_draws')
      - metric('opening_losses')
      - metric('opening_player_score')
      - metric('win_rate')
    owner:
      name: John Kennedy
      email: 38555153+jfk-ssa@users.noreply.github.com

  - name: portfolio_site
    label: Portfolio documentation site
    type: analysis
    maturity: high
    url: https://jfk-ssa.github.io/chess-analytics-lab/dbt-docs/
    description: >
      The public site publishes the metric and architecture guides and, from the
      Pages workflow, a dbt catalog generated on the tiny fixture. The site does
      not query the warehouse. The Streamlit dashboard is not an exposure of
      these models: it reads fact_game, fact_player_game, and fact_move on the
      analytical snapshot.
    depends_on:
      - ref('stg_games')
      - ref('stg_player_games')
      - ref('int_game_eligibility')
      - ref('mart_game_outcomes')
      - ref('mart_player_outcomes')
      - ref('games')
      - ref('player_games')
    owner:
      name: John Kennedy
      email: 38555153+jfk-ssa@users.noreply.github.com
