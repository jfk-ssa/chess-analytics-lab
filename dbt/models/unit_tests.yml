  - name: stg_player_games_surrogate_keys
    description: >
      game_key matches the game surrogate. player_game_key appends the color,
      so the two participants in one game do not share a key.
    model: stg_player_games
    given:
      - input: source('published', 'fact_player_game')
        rows:
          - {
              provider: lichess,
              game_id: aaaaaaaa,
              color: white,
              player_key: white-player,
              rating: 1500,
              opponent_rating: 1600,
              score: 1.0,
            }
          - {
              provider: lichess,
              game_id: aaaaaaaa,
              color: black,
              player_key: black-player,
              rating: 1600,
              opponent_rating: 1500,
              score: 0.0,
            }
    expect:
      rows:
        - {game_key: "lichess:aaaaaaaa", player_game_key: "lichess:aaaaaaaa:white", color: white}
        - {game_key: "lichess:aaaaaaaa", player_game_key: "lichess:aaaaaaaa:black", color: black}
