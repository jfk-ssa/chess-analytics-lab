              record_fingerprint: fp,
            }
          - {
              provider: lichess,
              game_id: padded,
              source_ordinal: 6,
              result: "1-0",
              rated: true,
              variant: Standard,
              utc_date: null,
              played_at: null,
              time_control: null,
              base_seconds: null,
              increment_seconds: null,
              source_opening: "  Sicilian Defense  : Najdorf",
