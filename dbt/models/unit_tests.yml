version: 2

unit_tests:
  - name: int_game_eligibility_metric_eligible_and_drawn
    description: >
      metric_eligible is a decisive result (1-0, 0-1, or 1/2-1/2) and not a
      marked bot. A star result is excluded. A marked bot is excluded.
      drawn is only the draw result, including a marked-bot draw. The mart
      numerator still requires both flags.
    model: int_game_eligibility
    given:
      - input: ref('stg_games')
        rows:
          - {result: "1-0", marked_bot: false}
          - {result: "0-1", marked_bot: false}
          - {result: "1/2-1/2", marked_bot: false}
          - {result: "*", marked_bot: false}
          - {result: "1-0", marked_bot: true}
          - {result: "1/2-1/2", marked_bot: true}
    expect:
      rows:
        - {result: "1-0", marked_bot: false, metric_eligible: true, drawn: false}
        - {result: "0-1", marked_bot: false, metric_eligible: true, drawn: false}
        - {result: "1/2-1/2", marked_bot: false, metric_eligible: true, drawn: true}
        - {result: "*", marked_bot: false, metric_eligible: false, drawn: false}
        - {result: "1-0", marked_bot: true, metric_eligible: false, drawn: false}
        - {result: "1/2-1/2", marked_bot: true, metric_eligible: false, drawn: true}

  - name: stg_games_opening_family_and_game_key
    description: >
      opening_family is the trimmed text before the first colon. Blank,
      missing, and colon-only tags are null. A tag with no colon is trimmed
      and kept. game_key is provider, a colon, and game_id.
    model: stg_games
    given:
      - input: source('published', 'fact_game')
        rows:
          - {
              provider: lichess,
              game_id: nullopen,
              source_ordinal: 1,
              result: "1-0",
              rated: true,
              variant: Standard,
              utc_date: null,
              played_at: null,
              time_control: null,
              base_seconds: null,
              increment_seconds: null,
              source_opening: null,
              source_eco: null,
              marked_bot: false,
              ply_count: 1,
              record_fingerprint: fp,
            }
          - {
              provider: lichess,
              game_id: blank,
              source_ordinal: 2,
              result: "1-0",
              rated: true,
              variant: Standard,
