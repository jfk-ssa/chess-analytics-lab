version: 2
models:
  - name: metricflow_time_spine
    description: Required by dbt parse for any semantic project. Analyst queries do not group by it.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar day from 2012-01-01 through 2030-12-31.
        granularity: day
        data_tests: [not_null, unique]
  - name: games
    description: One accepted game, with the contract draw-rate flags and the source opening family.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: utc_date
    columns:
      - name: game_key
        data_type: varchar
        description: Primary game entity. Composite provider and game_id cannot be the entity.
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: game
      - name: provider
        data_type: varchar
      - name: game_id
        data_type: varchar
      - name: rated
        data_type: boolean
      - name: variant
        data_type: varchar
      - name: result
        data_type: varchar
      - name: marked_bot
        data_type: boolean
      - name: metric_eligible
        data_type: boolean
      - name: drawn
        data_type: boolean
      - name: utc_date
        data_type: date
        description: Provider UTC date. Null dates stay null. Queries that do not group by time do not filter them.
        granularity: day
        dimension:
          type: time
      - name: base_seconds
        data_type: bigint
        description: Exact base time in seconds. Null when the source control is missing.
        dimension:
          type: categorical
      - name: increment_seconds
        data_type: bigint
        description: Exact increment in seconds. Null when the source control is missing.
        dimension:
          type: categorical
      - name: source_opening
        data_type: varchar
      - name: opening_family
        data_type: varchar
        description: Trimmed source opening text before the first colon. Blank text is null.
        dimension:
          type: categorical
      - name: eligible_game
        data_type: integer
        description: 1 when the game is rated Standard, completed, and not a source-marked bot.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: drawn_game
        data_type: integer
        description: 1 when an eligible game result is 1/2-1/2.
      - name: known_opening_game
        data_type: integer
        description: 1 when an eligible game has a nonempty opening family.
      - name: unknown_opening_game
        data_type: integer
        description: 1 when an eligible game has no opening family.
    metrics:
      - name: eligible_games
        description: Completed rated Standard games, excluding source-marked bots.
        label: Eligible games
        type: simple
        agg: sum
        expr: eligible_game
      - name: drawn_games
        description: Eligible games whose result is 1/2-1/2.
        label: Drawn games
        type: simple
        agg: sum
        expr: drawn_game
      - name: known_opening_games
        description: Eligible games with a nonempty source opening family.
        label: Known-opening games
        type: simple
        agg: sum
        expr: known_opening_game
      - name: unknown_opening_games
        description: Eligible games with no source opening family.
        label: Unknown-opening games
        type: simple
        agg: sum
        expr: unknown_opening_game
      - name: game_draw_rate
        description: Drawn eligible games divided by eligible games. A zero denominator is null.
        label: Game draw rate
        type: ratio
        numerator: drawn_games
        denominator: eligible_games
  - name: player_games
    description: One player in one game. Opening family and time control are copied from the game.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: utc_date
    columns:
      - name: player_game_key
        data_type: varchar
        description: Primary entity for one player in one game.
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: player_game
      - name: game_key
        data_type: varchar
        description: Game this player-game belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('games')
                field: game_key
        entity:
          type: foreign
          name: game
      - name: color
        data_type: varchar
        description: white or black.
        dimension:
          type: categorical
      - name: player_key
        data_type: varchar
      - name: rating
        data_type: bigint
        description: Rating at that game. The analyst filters a half-open range on this column.
        dimension:
          type: categorical
      - name: score
        data_type: double
      - name: utc_date
        data_type: date
        description: Game UTC date. Null stays null.
        granularity: day
        dimension:
          type: time
      - name: base_seconds
        data_type: bigint
        description: Exact base seconds copied from the game.
        dimension:
          type: categorical
      - name: increment_seconds
        data_type: bigint
        description: Exact increment seconds copied from the game.
        dimension:
          type: categorical
      - name: opening_family
        data_type: varchar
        description: Opening family copied from the game so a player-score filter does not depend on a join.
        dimension:
          type: categorical
      - name: score_eligible
        data_type: integer
        description: 1 for a rated Standard completed game with a known family and a known focal rating.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: eligible_score
        data_type: double
      - name: eligible_win
        data_type: integer
      - name: eligible_draw
        data_type: integer
      - name: eligible_loss
        data_type: integer
    metrics:
      - name: opening_score_games
        description: Player-games in the score-rate denominator.
        label: Opening score games
        type: simple
        agg: sum
        expr: score_eligible
      - name: opening_score_total
        description: Sum of scores. A loss contributes 0; an ineligible row contributes 0.
        label: Opening score total
        type: simple
        agg: sum
        expr: eligible_score
      - name: opening_wins
        description: Wins in the score-rate cohort.
        label: Opening wins
        type: simple
        agg: sum
        expr: eligible_win
      - name: opening_draws
        description: Draws in the score-rate cohort.
        label: Opening draws
        type: simple
        agg: sum
        expr: eligible_draw
      - name: opening_losses
        description: Losses in the score-rate cohort.
        label: Opening losses
        type: simple
        agg: sum
        expr: eligible_loss
      - name: opening_player_score
        description: Sum of scores divided by player-games. The analyst applies the low-support flag.
        label: Opening player score
        type: ratio
        numerator: opening_score_total
        denominator: opening_score_games
      - name: win_rate
        description: Wins divided by the same player-games as the score rate.
        label: Win rate
        type: ratio
        numerator: opening_wins
        denominator: opening_score_games
