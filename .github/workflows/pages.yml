name: Documentation website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
      - run: uv sync --locked --no-editable --extra docs --extra dbt
      - run: uv run --locked --offline --no-editable --extra docs --extra dbt python scripts/materialize_opening_positions.py
      - run: uv run --locked --offline --no-editable --extra docs --extra dbt ruff check .
      - run: uv run --locked --offline --no-editable --extra docs --extra dbt pytest -q tests/test_docs_site.py
      - run: uv run --locked --offline --no-editable --extra docs --extra dbt python scripts/build_docs_site.py
      - name: Publish dbt docs from the tiny fixture
        run: |
          set -euo pipefail
          uv run --locked --offline --no-editable --extra docs --extra dbt chesslab demo
          uv run --locked --offline --no-editable --extra docs --extra dbt python -m chess_analytics.marts transform --dataset tiny
          mart="$(uv run --locked --offline --no-editable --extra docs --extra dbt python -c 'import json; print(json.load(open("data/tiny-mart-current.json"))["mart_id"])')"
          cp "$PWD/data/marts/published/${mart}/warehouse.duckdb" "$RUNNER_TEMP/warehouse.duckdb"
          export CHESSLAB_DBT_PATH="$RUNNER_TEMP/warehouse.duckdb"
          export DBT_PROFILES_DIR="$PWD/dbt"
          export DBT_SEND_ANONYMOUS_USAGE_STATS=false
          export DO_NOT_TRACK=1
          # A relative target path is stored as target/compiled/... An absolute path is stored as that absolute path.
          uv run --locked --offline --no-editable --extra docs --extra dbt dbt docs generate --project-dir dbt --profiles-dir dbt --target-path target --log-path dbt/target/logs --no-use-colors
          rm -rf work/docs-site/dbt-docs
          mkdir -p work/docs-site/dbt-docs
          cp dbt/target/index.html dbt/target/manifest.json dbt/target/catalog.json work/docs-site/dbt-docs/
          test -s work/docs-site/dbt-docs/catalog.json
          uv run --locked --offline --no-editable --extra docs --extra dbt python -c 'import json; path=json.load(open("work/docs-site/dbt-docs/manifest.json"))["nodes"]["model.chess_analytics.games"]["compiled_path"]; assert path.startswith("target/"), path'
          if grep -q "has not generated the dbt catalog" work/docs-site/dbt-docs/index.html; then
            echo "dbt docs output is still the local placeholder" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: work/docs-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
