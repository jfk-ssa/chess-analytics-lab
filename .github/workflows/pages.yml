name: Documentation website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv sync --locked --no-editable --extra docs
      - run: uv run --locked --offline --no-editable --extra docs ruff check .
      - run: uv run --locked --offline --no-editable --extra docs pytest -q tests/test_docs_site.py
      - run: uv run --locked --offline --no-editable --extra docs python scripts/build_docs_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/docs-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
