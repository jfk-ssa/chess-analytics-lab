name: Offline integrity
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # BEGIN managed outputs
      run_all: ${{ steps.filter.outputs.run_all }}
      categories: ${{ steps.filter.outputs.categories }}
      biome: ${{ steps.filter.outputs.biome }}
      node_test: ${{ steps.filter.outputs.node_test }}
      node_check_import: ${{ steps.filter.outputs.node_check_import }}
      node_parity_authored: ${{ steps.filter.outputs.node_parity_authored }}
      node_parity_zero: ${{ steps.filter.outputs.node_parity_zero }}
      ruff: ${{ steps.filter.outputs.ruff }}
      ruff_format: ${{ steps.filter.outputs.ruff_format }}
      basedpyright: ${{ steps.filter.outputs.basedpyright }}
      pytest_extract: ${{ steps.filter.outputs.pytest_extract }}
      pytest_dashboard: ${{ steps.filter.outputs.pytest_dashboard }}
      pytest_game_import: ${{ steps.filter.outputs.pytest_game_import }}
      pytest_mcp: ${{ steps.filter.outputs.pytest_mcp }}
      pytest_ml: ${{ steps.filter.outputs.pytest_ml }}
      demo: ${{ steps.filter.outputs.demo }}
      pytest_dbt: ${{ steps.filter.outputs.pytest_dbt }}
      transform: ${{ steps.filter.outputs.transform }}
      semantic: ${{ steps.filter.outputs.semantic }}
      analyst_gate: ${{ steps.filter.outputs.analyst_gate }}
      dbt_slim: ${{ steps.filter.outputs.dbt_slim }}
      pytest: ${{ steps.filter.outputs.pytest }}
      pytest_portfolio: ${{ steps.filter.outputs.pytest_portfolio }}
      demo_all: ${{ steps.filter.outputs.demo_all }}
      setup_uv: ${{ steps.filter.outputs.setup_uv }}
      setup_node: ${{ steps.filter.outputs.setup_node }}
      sync: ${{ steps.filter.outputs.sync }}
      dbt_base_checkout: ${{ steps.filter.outputs.dbt_base_checkout }}
      core_setup_uv: ${{ steps.filter.outputs.core_setup_uv }}
      core_setup_node: ${{ steps.filter.outputs.core_setup_node }}
      core_sync: ${{ steps.filter.outputs.core_sync }}
      portfolio_setup_uv: ${{ steps.filter.outputs.portfolio_setup_uv }}
      portfolio_sync: ${{ steps.filter.outputs.portfolio_sync }}
      # END managed outputs
    steps:
      - id: changes_checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            python3 scripts/ci_offline_changes.py --event "${EVENT_NAME}" --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! printf '%s' "${BASE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "base sha unavailable; running the full suite" >&2
            python3 scripts/ci_offline_changes.py --event full --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit missing; running the full suite" >&2
            python3 scripts/ci_offline_changes.py --event full --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          diff_file="${RUNNER_TEMP}/changed.txt"
          if ! git diff --name-status --find-renames "${BASE_SHA}" HEAD > "${diff_file}"; then
            echo "git diff failed; running the full suite" >&2
            python3 scripts/ci_offline_changes.py --event full --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ ! -s "${diff_file}" ]; then
            echo "empty diff; running the full suite" >&2
            python3 scripts/ci_offline_changes.py --event full --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 scripts/ci_offline_changes.py --event pull_request --name-status "${diff_file}" --github-output "${GITHUB_OUTPUT}"
  offline:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # BEGIN managed offline
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: audit_map
        name: Audit map
        run: python3 scripts/ci_offline_changes.py --audit
      - id: record_selection
        name: Record selection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
        run: python3 scripts/ci_offline_install.py --validate-only
      - id: setup_uv
        name: Setup uv
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.setup_uv == 'true' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.12.18"
          enable-cache: true
          cache-suffix: offline
      - id: setup_node
        name: Setup node
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.setup_node == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - id: biome
        name: Biome
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.biome == 'true' }}
        run: npx --yes @biomejs/biome@2.5.15 check
      - id: node_test
        name: Node test
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.node_test == 'true' }}
        run: node --test --test-isolation=none tests/js/game_import.test.mjs tests/js/dashboard.test.mjs
      - id: node_check_import
        name: Node check import
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.node_check_import == 'true' }}
        run: node scripts/check_game_import.mjs
      - id: node_parity_authored
        name: Node parity authored
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.node_parity_authored == 'true' }}
        run: node tests/js/import_parity.mjs tests/fixtures/imports/authored-games.pgn
      - id: node_parity_zero
        name: Node parity zero
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.node_parity_zero == 'true' }}
        run: node tests/js/import_parity.mjs tests/fixtures/imports/zero-castling.pgn
      - id: sync
        name: Sync
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.sync == 'true' }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
        run: python3 scripts/ci_offline_install.py
      - id: ruff
        name: Ruff
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.ruff == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync ruff check .
      - id: ruff_format
        name: Ruff format
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.ruff_format == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync ruff format --check .
      - id: basedpyright
        name: Basedpyright
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.basedpyright == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync basedpyright
      - id: pytest_extract
        name: Pytest extract
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest_extract == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync pytest -q tests/test_public_extract.py
      - id: pytest_dashboard
        name: Pytest dashboard
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest_dashboard == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync pytest -q tests/test_dashboard_cube.py tests/test_dashboard_export.py
      - id: pytest_game_import
        name: Pytest game import
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest_game_import == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync pytest -q tests/test_game_import.py
      - id: pytest_mcp
        name: Pytest mcp
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest_mcp == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync pytest -q tests/test_mcp_protocol.py
      - id: pytest_ml
        name: Pytest ml
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest_ml == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync pytest -q tests/test_mistake_classifier.py
      - id: demo
        name: Demo
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.demo == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync chesslab demo
      - id: pytest_dbt
        name: Pytest dbt
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest_dbt == 'true' }}
        run: CHESSLAB_REQUIRE_DBT=1 uv run --locked --offline --no-editable --no-sync pytest -m dbt -q -n 4 --dist loadscope --durations=15
      - id: transform
        name: Transform
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.transform == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync python -m chess_analytics.marts transform --dataset tiny
      - id: semantic
        name: Semantic
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.semantic == 'true' }}
        run: |
          set -euo pipefail
          mart="$(uv run --locked --offline --no-editable --no-sync python -c 'import json; print(json.load(open("data/tiny-mart-current.json"))["mart_id"])')"
          warehouse="$PWD/data/marts/published/${mart}/warehouse.duckdb"
          manifest="$PWD/data/marts/published/${mart}/semantic_manifest.json"
          cp "$warehouse" "$RUNNER_TEMP/warehouse.duckdb"
          export CHESSLAB_DBT_PATH="$RUNNER_TEMP/warehouse.duckdb"
          export DBT_PROFILES_DIR="$PWD/dbt"
          export DBT_PROJECT_DIR="$PWD/dbt"
          export DBT_TARGET=local
          export DBT_SEND_ANONYMOUS_USAGE_STATS=false
          export DO_NOT_TRACK=1
          export DBT_LOG_PATH="$RUNNER_TEMP/dbt-logs"
          uv run --locked --offline --no-editable --no-sync dbt parse --project-dir dbt --profiles-dir dbt --target-path "$RUNNER_TEMP/dbt-target" --no-use-colors
          uv run --locked --offline --no-editable --no-sync python -m chess_analytics.analyst.semantic validate-configs "$RUNNER_TEMP/dbt-target/semantic_manifest.json"
          uv run --locked --offline --no-editable --no-sync python -m chess_analytics.analyst.semantic smoke-draw-rate "$warehouse" "$manifest"
          uv run --locked --offline --no-editable --no-sync python scripts/render_dbt_dag.py --manifest "$RUNNER_TEMP/dbt-target/manifest.json" --output docs/DBT_LINEAGE.md --check
      - id: analyst_gate
        name: Analyst gate
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.analyst_gate == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync python -m chess_analytics.analyst gate
      - id: dbt_base_checkout
        name: Dbt base checkout
        if: ${{ (needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.dbt_base_checkout == 'true') && (github.event_name == 'pull_request' || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before != '')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: base-checkout
          fetch-depth: 1
          sparse-checkout: dbt
          persist-credentials: false
      - id: dbt_slim
        name: Dbt slim
        if: ${{ needs.changes.result != 'success' || steps.record_selection.outputs.fallback != 'false' || needs.changes.outputs.dbt_slim == 'true' }}
        run: |
          set -euo pipefail
          if [ ! -f base-checkout/dbt/dbt_project.yml ]; then
            echo "slim CI: no base dbt project; skipping state selection"
            exit 0
          fi
          mart="$(uv run --locked --offline --no-editable --no-sync python -c 'import json; print(json.load(open("data/tiny-mart-current.json"))["mart_id"])')"
          # The file stem is the DuckDB catalog. Published views qualify "warehouse".
          mkdir -p "$RUNNER_TEMP/slim"
          cp "$PWD/data/marts/published/${mart}/warehouse.duckdb" "$RUNNER_TEMP/slim/warehouse.duckdb"
          export CHESSLAB_DBT_PATH="$RUNNER_TEMP/slim/warehouse.duckdb"
          export DBT_PROFILES_DIR="$PWD/dbt"
          export DBT_SEND_ANONYMOUS_USAGE_STATS=false
          export DO_NOT_TRACK=1
          state="${RUNNER_TEMP}/dbt-state"
          uv run --locked --offline --no-editable --no-sync dbt parse --project-dir base-checkout/dbt --profiles-dir base-checkout/dbt --target-path "${state}" --log-path "$RUNNER_TEMP/dbt-state-logs" --no-use-colors
          echo "slim CI: state:modified+"
          uv run --locked --offline --no-editable --no-sync dbt ls --select "state:modified+" --state "${state}" --project-dir dbt --profiles-dir dbt --target-path "$RUNNER_TEMP/dbt-slim" --log-path "$RUNNER_TEMP/dbt-slim-logs" --no-use-colors
          uv run --locked --offline --no-editable --no-sync dbt build --select "state:modified+" --state "${state}" --project-dir dbt --profiles-dir dbt --target-path "$RUNNER_TEMP/dbt-slim" --log-path "$RUNNER_TEMP/dbt-slim-logs" --no-use-colors
          # dbt 1.12 build counts modified unit tests but does not run them when their model is unmodified.
          uv run --locked --offline --no-editable --no-sync dbt test --select "test_type:unit,state:modified" --state "${state}" --project-dir dbt --profiles-dir dbt --target-path "$RUNNER_TEMP/dbt-slim" --log-path "$RUNNER_TEMP/dbt-slim-logs" --no-use-colors
      # END managed offline
  offline-core:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # BEGIN managed offline-core
      - id: core_checkout
        name: Core checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: core_selection
        name: Core selection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
        run: python3 scripts/ci_offline_install.py --validate-only
      - id: core_setup_uv
        name: Core setup uv
        if: ${{ needs.changes.result != 'success' || steps.core_selection.outputs.fallback != 'false' || needs.changes.outputs.core_setup_uv == 'true' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.12.18"
          enable-cache: true
          cache-suffix: offline-core
      - id: core_setup_node
        name: Core setup node
        if: ${{ needs.changes.result != 'success' || steps.core_selection.outputs.fallback != 'false' || needs.changes.outputs.core_setup_node == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - id: core_sync
        name: Core sync
        if: ${{ needs.changes.result != 'success' || steps.core_selection.outputs.fallback != 'false' || needs.changes.outputs.core_sync == 'true' }}
        run: uv sync --locked --no-editable
      - id: pytest
        name: Pytest
        if: ${{ needs.changes.result != 'success' || steps.core_selection.outputs.fallback != 'false' || needs.changes.outputs.pytest == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync pytest -q -n 4 --durations=15
      # END managed offline-core
  portfolio:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # BEGIN managed portfolio
      - id: portfolio_checkout
        name: Portfolio checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: portfolio_record
        name: Portfolio record
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
        run: python3 scripts/ci_offline_install.py --validate-only
      - id: portfolio_setup_uv
        name: Portfolio setup uv
        if: ${{ needs.changes.result != 'success' || steps.portfolio_record.outputs.fallback != 'false' || needs.changes.outputs.portfolio_setup_uv == 'true' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.12.18"
          enable-cache: true
          cache-suffix: portfolio
      - id: portfolio_sync
        name: Portfolio sync
        if: ${{ needs.changes.result != 'success' || steps.portfolio_record.outputs.fallback != 'false' || needs.changes.outputs.portfolio_sync == 'true' }}
        run: uv sync --locked --no-editable --extra dashboard
      - id: pytest_portfolio
        name: Pytest portfolio
        if: ${{ needs.changes.result != 'success' || steps.portfolio_record.outputs.fallback != 'false' || needs.changes.outputs.pytest_portfolio == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync --extra dashboard pytest -q tests/test_portfolio_integrity.py tests/test_portfolio_demo.py tests/test_hosted_dashboard.py
      - id: demo_all
        name: Demo all
        if: ${{ needs.changes.result != 'success' || steps.portfolio_record.outputs.fallback != 'false' || needs.changes.outputs.demo_all == 'true' }}
        run: uv run --locked --offline --no-editable --no-sync --extra dashboard chesslab demo --scope all
      # END managed portfolio
