name: Offline integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv sync --locked --no-editable
      - run: uv run --locked --offline --no-editable ruff check .
      - run: uv run --locked --offline --no-editable ruff format --check .
      - run: uv run --locked --offline --no-editable basedpyright
      - run: uv run --locked --offline --no-editable pytest -q
      - run: uv run --locked --offline --no-editable chesslab demo
      - run: uv sync --locked --no-editable --extra dbt
      - run: uv run --locked --offline --no-editable --extra dbt pytest -q
      - run: uv run --locked --offline --no-editable --extra dbt python -m platform_m2 transform --dataset tiny
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv sync --locked --no-editable --extra dashboard
      - run: uv run --locked --offline --no-editable --extra dashboard pytest -q tests/test_portfolio_integrity.py tests/test_portfolio_demo.py
      - run: uv run --locked --offline --no-editable --extra dashboard chesslab demo --scope all
