version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # ADR 0108. First match wins, and the catch-all below would claim these.
      # dagster-webserver requires the same dagster version, so they move together.
      dagster:
        patterns:
          - "dagster*"
      uv-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "dagster*"
    # ADR 0104. Protobuf 7 does not resolve next to the locked Dagster and dbt extras.
    ignore:
      - dependency-name: "protobuf"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
