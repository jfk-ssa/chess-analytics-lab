[build-system]
requires = ["hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0", "trove-classifiers==2026.9.21.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analytics", "orchestration", "platform_m2", "analytics_m3", "analytics_m4", "analyst_m5"]

[tool.hatch.build.targets.sdist]
exclude = ["/work/**", "/.uv-cache/**", "/.venv/**", "/auxiliary-examples/**"]

[project]
name = "chess-analytics-lab"
version = "0.1.0"
description = "Local, reproducible chess analytics with explicit evidence"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["chess==1.11.2", "duckdb==1.5.6", "zstandard==0.25.0"]

[project.scripts]
chesslab = "chess_analytics.cli:main"

[project.optional-dependencies]
docs = ["Markdown==3.11"]
dagster = [
    "dagster==1.13.25",
    "dagster-webserver==1.13.25",
]
prefect = [
    "prefect==3.8.8",
]
dbt = [
    "dbt-duckdb==1.11.0",
]
dashboard = [
    "streamlit==1.65.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
