[build-system]
requires = ["hatchling==1.27.0", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0", "trove-classifiers==2026.9.21.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analytics", "orchestration", "analyst_m5"]

[tool.hatch.build.targets.sdist]
exclude = ["/work/**", "/.uv-cache/**", "/.venv/**", "/auxiliary-examples/**"]

[project]
name = "chess-analytics-lab"
version = "0.1.0"
description = "Local, reproducible chess analytics with explicit evidence"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["chess==1.11.2", "duckdb==1.4.1", "zstandard==0.25.0"]

[project.scripts]
chesslab = "chess_analytics.cli:main"

[project.optional-dependencies]
docs = ["Markdown==3.11"]
dagster = [
    "dagster==1.13.25",
    "dagster-webserver==1.13.25",
]
prefect = [
    "prefect==3.8.7",
]
dbt = [
    "dbt-duckdb==1.10.1",
]
dashboard = [
    "streamlit==1.50.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.31.7",
    "pytest==8.4.2",
    "ruff==0.14.0",
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "N", "C90"]
# Current ceiling. Two historical modules sit above it and are ignored per file
# until a later split; new code should stay at or below this.
mccabe.max-complexity = 22
# En dashes, minus signs, and similar marks are intentional in questions and reports.
allowed-confusables = ["–", "−", "×", "～"]

[tool.ruff.lint.per-file-ignores]
# Case builders and the paired end-to-end runner exceed the complexity ceiling.
# Leave them alone here; a later change can split them and drop the ignore.
"scripts/build_m5_cases.py" = ["C901"]
"src/chess_analytics/jev_e2e.py" = ["C901"]
