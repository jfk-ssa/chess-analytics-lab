[build-system]
requires = ["hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.7.0", "trove-classifiers==2026.9.21.13"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analytics"]

[tool.hatch.build.targets.sdist]
exclude = ["/work/**", "/.uv-cache/**", "/.venv/**", "/auxiliary-examples/**"]

[project]
name = "chess-analytics-lab"
version = "0.1.0"
description = "Local, reproducible chess analytics with explicit evidence"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["chess==1.11.2", "duckdb==2.0.0", "zstandard==0.25.0"]

[project.scripts]
chesslab = "chess_analytics.cli:main"

[project.optional-dependencies]
docs = ["Markdown==3.11", "jinja2==3.1.6"]
# dagster-webserver==X requires dagster==X. Dependabot upgrades one name
# per uv lock. >=1.13.26,<2 lets either upgrade carry the other through
# 1.x, including a floor raised to >=1.14 on only one name. uv.lock is
# the installed set. See ADR 0108.
dagster = [
    "dagster>=1.13.26,<2",
    "dagster-webserver>=1.13.26,<2",
]
prefect = [
    "prefect==3.9.0",
]
dbt = [
    "dbt-duckdb==1.11.0",
]
# Pillow 13.0.0 closes the GHSA set on 11.3.0. Streamlit 1.65.0 required
# pillow<13, and 1.66.1 accepts pillow<14. Certifi 2026.10.19 removes the
# compromised emSign intermediates (GHSA-6q48-6c7w-9gw2).
dashboard = [
    "streamlit==1.66.1",
    "pillow==13.0.0",
    "certifi==2026.10.19",
]
mcp = [
    "mcp==2.3.0",
]
# Linux PyPI torch 2.14.1 depends on CUDA libraries. The CPU index build is
# the one this tool runs. macOS keeps the PyPI arm64 wheel.
maia = [
    "torch==2.14.1 ; sys_platform != 'linux'",
    "torch==2.14.1+cpu ; sys_platform == 'linux'",
    "maia3 @ git+https://github.com/CSSLab/maia3.git@1e13597c42d4858b7cfd7cfdae01e297263364b2",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.basedpyright]
include = ["src", "hosted"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "N", "C90"]
# Current ceiling. New code should stay at or below this.
mccabe.max-complexity = 22
# En dashes, minus signs, and similar marks are intentional in questions and reports.
allowed-confusables = ["–", "−", "×", "～"]
